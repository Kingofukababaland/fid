<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soar - Haruka Nakamura feat. Substantial</title>

    <style>
        :root {
            --sun-yellow: #FAD68B;
            --warm-peach: #E5C3A5;
            --dusty-pink: #D2B3BF;
            --album-blue: #344D8C;
            --album-navy: #2E2750;
            --album-red: #961D27;
            --album-rose: #A8566F;
            --cream: #FBE9B1;
            --soft-white: #FFF8ED;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 55px 20px;

            background: linear-gradient(
                to bottom,
                var(--sun-yellow) 0%,
                #F1CD97 30%,
                var(--warm-peach) 58%,
                var(--dusty-pink) 100%
            );

            color: var(--album-navy);
            font-family: Georgia, "Times New Roman", serif;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 0 auto;
            padding: 55px 38px;

            background-color: rgba(255, 248, 237, 0.67);

            border: 2px solid rgba(52, 77, 140, 0.18);
            border-radius: 24px;

            box-shadow: 0 14px 35px rgba(46, 39, 80, 0.18);
        }

        h1 {
            margin: 0;

            font-size: 76px;
            letter-spacing: 12px;

            color: var(--album-navy);

            text-transform: uppercase;
        }

        h2 {
            margin-top: 10px;

            font-size: 22px;
            font-weight: normal;

            color: var(--album-blue);
        }

        .divider {
            width: 145px;
            height: 4px;

            margin: 30px auto;

            border-radius: 8px;

            background: linear-gradient(
                to right,
                var(--album-blue),
                var(--album-rose),
                var(--album-red)
            );
        }

        .lyrics {
            margin: 38px auto;
        }

        .lyric-one {
            margin-bottom: 16px;

            font-size: 32px;
            line-height: 1.4;

            color: var(--album-navy);
        }

        .lyric-two {
            font-size: 25px;
            line-height: 1.5;

            color: var(--album-rose);

            font-style: italic;
        }

        .description {
            max-width: 620px;

            margin: 32px auto;
            padding: 18px 22px;

            background-color: rgba(251, 233, 177, 0.42);

            border-left: 4px solid var(--album-red);
            border-radius: 10px;

            color: #51435E;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;

            line-height: 1.7;
            text-align: left;
        }

        a {
            display: inline-block;

            margin-top: 6px;
            padding: 14px 26px;

            background-color: var(--album-blue);

            color: var(--soft-white);

            border-radius: 28px;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;

            text-decoration: none;
        }

        a:hover {
            background-color: var(--album-red);
        }

        footer {
            margin-top: 35px;

            color: #645571;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;

            line-height: 1.6;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>SOAR</h1>

        <h2>
            Haruka Nakamura feat. Substantial
        </h2>

        <div class="divider"></div>

        <section class="lyrics">

            <p class="lyric-one">
                "Just trying to find peace of mind"
            </p>

            <p class="lyric-two">
                "Sit back let my seat recline"
            </p>

        </section>

        

        <a
            href="https://youtu.be/Npk0zqP1obs?si=EMUH9aiSKKdXjbAQ"
            target="_blank"
        >
            Listen to "Soar" on YouTube
        </a>

        <footer>
            Song: "Soar" by Haruka Nakamura feat. Substantial
        </footer>

    </main>

</body>
</html>
